<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chemistry Nomenclature Study Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
<style>
  :root {
    --bg: #f8f7f4;
    --surface: #ffffff;
    --surface2: #f0efe9;
    --border: rgba(0,0,0,0.12);
    --border-strong: rgba(0,0,0,0.22);
    --text: #1a1a18;
    --text2: #5a5a55;
    --text3: #8a8a82;
    --blue: #185fa5;
    --blue-bg: #e6f1fb;
    --blue-text: #0c447c;
    --green: #3b6d11;
    --green-bg: #eaf3de;
    --green-text: #27500a;
    --amber: #ba7517;
    --amber-bg: #faeeda;
    --amber-text: #633806;
    --purple: #534ab7;
    --purple-bg: #eeedfe;
    --purple-text: #3c3489;
    --success-bg: #eaf3de;
    --success-text: #27500a;
    --danger-bg: #fcebeb;
    --danger-text: #791f1f;
    --radius: 8px;
    --radius-lg: 12px;
    --font: 'Sora', sans-serif;
    --mono: 'IBM Plex Mono', monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a18;
      --surface: #242422;
      --surface2: #2e2e2c;
      --border: rgba(255,255,255,0.1);
      --border-strong: rgba(255,255,255,0.2);
      --text: #f0efe9;
      --text2: #a8a89e;
      --text3: #6e6e66;
      --blue: #378add;
      --blue-bg: #0c2a47;
      --blue-text: #85b7eb;
      --green: #639922;
      --green-bg: #1a2e08;
      --green-text: #c0dd97;
      --amber: #ef9f27;
      --amber-bg: #2e1e06;
      --amber-text: #fac775;
      --purple: #7f77dd;
      --purple-bg: #1e1c42;
      --purple-text: #afa9ec;
      --success-bg: #1a2e08;
      --success-text: #c0dd97;
      --danger-bg: #2e0e0e;
      --danger-text: #f09595;
    }
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
  }
  .page-wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 2rem 1.25rem 4rem;
  }
  header {
    margin-bottom: 2rem;
    padding-bottom: 1.25rem;
    border-bottom: 0.5px solid var(--border);
  }
  header h1 {
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
  }
  header p { font-size: 14px; color: var(--text2); }

  .mode-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 1.5rem;
  }
  @media (max-width: 480px) { .mode-grid { grid-template-columns: repeat(2, 1fr); } }
  .mode-btn {
    padding: 10px 8px;
    border: 0.5px solid var(--border-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    font-family: var(--font);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    text-align: center;
    line-height: 1.4;
  }
  .mode-btn:hover { background: var(--surface2); }
  .mode-btn.active {
    background: var(--blue-bg);
    color: var(--blue-text);
    border-color: var(--blue);
  }
  .category-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 1.25rem;
  }
  .cat-btn {
    padding: 8px 12px;
    border: 0.5px solid var(--border-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s;
  }
  .cat-btn:hover { background: var(--surface2); }
  .cat-btn .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .cat-btn.active.cat-all { background: var(--purple-bg); color: var(--purple-text); border-color: var(--purple); }
  .cat-btn.active.cat-ionic { background: var(--blue-bg); color: var(--blue-text); border-color: var(--blue); }
  .cat-btn.active.cat-covalent { background: var(--green-bg); color: var(--green-text); border-color: var(--green); }
  .cat-btn.active.cat-poly { background: var(--amber-bg); color: var(--amber-text); border-color: var(--amber); }
  .dot-all { background: var(--purple); }
  .dot-ionic { background: var(--blue); }
  .dot-covalent { background: var(--green); }
  .dot-poly { background: var(--amber); }

  .section-label { font-size: 12px; font-weight: 500; color: var(--text3); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 8px; }

  .progress-bar { height: 3px; background: var(--surface2); border-radius: 2px; margin-bottom: 1rem; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--blue); border-radius: 2px; transition: width 0.35s; }

  .stats { display: flex; gap: 20px; margin-bottom: 1.25rem; }
  .stat { font-size: 13px; color: var(--text2); }
  .stat span { font-weight: 600; color: var(--text); }

  .question-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.25rem;
    margin-bottom: 1rem;
  }
  .q-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text3);
    letter-spacing: 0.07em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .type-badge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 9px;
    border-radius: 10px;
    font-weight: 500;
    margin-bottom: 8px;
  }
  .badge-ionic { background: var(--blue-bg); color: var(--blue-text); }
  .badge-covalent { background: var(--green-bg); color: var(--green-text); }
  .badge-polyatomic { background: var(--amber-bg); color: var(--amber-text); }

  .chem-display {
    font-family: var(--mono);
    font-size: 30px;
    font-weight: 500;
    color: var(--text);
    margin: 0.4rem 0 0.8rem;
    line-height: 1.3;
    word-break: break-all;
  }
  .name-display {
    font-size: 20px;
    font-weight: 500;
    color: var(--text);
    margin: 0.4rem 0 0.8rem;
    line-height: 1.4;
  }
  .hint { font-size: 13px; color: var(--text2); margin-bottom: 1rem; line-height: 1.6; }

  .sub-toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 8px;
  }
  .sub-btn {
    padding: 3px 9px;
    border: 0.5px solid var(--border-strong);
    border-radius: 20px;
    background: var(--surface2);
    color: var(--text2);
    font-family: var(--mono);
    font-size: 13px;
    cursor: pointer;
    transition: color 0.1s, border-color 0.1s;
  }
  .sub-btn:hover { border-color: var(--blue); color: var(--text); }

  .text-input, .chem-input {
    width: 100%;
    font-size: 15px;
    font-family: var(--font);
    border: 0.5px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 9px 13px;
    background: var(--surface);
    color: var(--text);
    outline: none;
    margin-bottom: 10px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .chem-input { font-family: var(--mono); }
  .text-input:focus, .chem-input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(24,95,165,0.12);
  }

  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    padding: 8px 18px;
    border: 0.5px solid var(--border-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn:hover { background: var(--surface2); }
  .btn.primary {
    background: var(--blue-bg);
    color: var(--blue-text);
    border-color: var(--blue);
  }
  .btn.primary:hover { opacity: 0.85; }
  .btn.success-btn {
    background: var(--success-bg);
    color: var(--success-text);
    border-color: var(--green);
  }
  .btn.danger-btn {
    background: var(--danger-bg);
    color: var(--danger-text);
    border-color: #a32d2d;
  }

  .result-banner {
    padding: 12px 16px;
    border-radius: var(--radius);
    margin-top: 12px;
    font-size: 14px;
    line-height: 1.5;
  }
  .result-correct { background: var(--success-bg); color: var(--success-text); }
  .result-wrong { background: var(--danger-bg); color: var(--danger-text); }
  .result-answer { margin-top: 6px; font-weight: 600; font-family: var(--mono); font-size: 15px; }

  .flashcard {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 2.5rem 1.5rem;
    margin-bottom: 1rem;
    text-align: center;
    cursor: pointer;
    min-height: 180px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
    user-select: none;
  }
  .flashcard:hover { background: var(--surface2); }
  .fc-label { font-size: 11px; color: var(--text3); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 14px; }
  .fc-content { font-size: 28px; font-weight: 500; font-family: var(--mono); color: var(--text); line-height: 1.3; }
  .fc-name { font-size: 20px; font-weight: 500; color: var(--text); }
  .fc-hint { font-size: 13px; color: var(--text2); margin-top: 10px; }
  .fc-back { text-align: center; margin-bottom: 1rem; display: none; }
  .fc-back.shown { display: block; }
  .fc-back-label { font-size: 12px; color: var(--text3); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
  .fc-back-content { font-size: 22px; font-weight: 500; font-family: var(--mono); color: var(--text); }

  .poly-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 1rem; }
  @media (max-width: 480px) { .poly-grid { grid-template-columns: 1fr; } }
  .poly-card {
    background: var(--surface2);
    border-radius: var(--radius);
    padding: 10px 13px;
    border: 0.5px solid var(--border);
  }
  .poly-card .pc-name { font-size: 13px; font-weight: 500; color: var(--text); }
  .poly-card .pc-formula { font-size: 14px; font-family: var(--mono); color: var(--blue); margin-top: 3px; }

  .tab-row {
    display: flex;
    gap: 4px;
    border-bottom: 0.5px solid var(--border);
    margin-bottom: 1rem;
  }
  .tab {
    padding: 9px 15px;
    font-size: 13px;
    font-family: var(--font);
    cursor: pointer;
    color: var(--text2);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
    transition: color 0.15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 600; }

  .rule-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1rem 1.25rem;
    margin-bottom: 10px;
    border-left-width: 3px;
  }
  .rule-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--text); }
  .rule-card p { font-size: 13px; color: var(--text2); line-height: 1.75; }
  .rule-card strong { color: var(--text); font-weight: 600; }

  .prefix-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }
  .prefix-item {
    background: var(--surface2);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .prefix-item .pref { font-family: var(--mono); font-weight: 500; color: var(--text); font-size: 14px; }
  .prefix-item .num { color: var(--text2); font-size: 13px; }

  .notice {
    margin-top: 12px;
    font-size: 13px;
    color: var(--amber-text);
    background: var(--amber-bg);
    border-radius: var(--radius);
    padding: 10px 14px;
    line-height: 1.6;
  }

  sup { font-size: 0.6em; vertical-align: super; }
  sub { font-size: 0.6em; vertical-align: sub; }
  #categoryRow { margin-bottom: 1.25rem; }
</style>
</head>
<body>
<div class="page-wrap">
  <header>
    <h1>Chemistry Nomenclature</h1>
    <p>Choose a mode to practice naming ionic, covalent, and polyatomic compounds</p>
  </header>

  <div class="mode-grid" id="modeGrid">
    <button class="mode-btn active" onclick="setMode('formula-to-name')">Formula → Name</button>
    <button class="mode-btn" onclick="setMode('name-to-formula')">Name → Formula</button>
    <button class="mode-btn" onclick="setMode('polyatomic')">Polyatomic recall</button>
    <button class="mode-btn" onclick="setMode('ionic-or-covalent')">Ionic or covalent?</button>
    <button class="mode-btn" onclick="setMode('flashcards')">Flashcards</button>
    <button class="mode-btn" onclick="setMode('reference')">Reference sheet</button>
  </div>

  <div id="categoryRow">
    <div class="section-label">Category</div>
    <div class="category-grid">
      <button class="cat-btn cat-all active" id="cat-all" onclick="setCategory('all')"><span class="dot dot-all"></span>All types</button>
      <button class="cat-btn cat-ionic" id="cat-ionic" onclick="setCategory('ionic')"><span class="dot dot-ionic"></span>Binary ionic</button>
      <button class="cat-btn cat-covalent" id="cat-covalent" onclick="setCategory('covalent')"><span class="dot dot-covalent"></span>Binary covalent</button>
      <button class="cat-btn cat-poly" id="cat-poly" onclick="setCategory('polyatomic')"><span class="dot dot-poly"></span>With polyatomic ions</button>
    </div>
  </div>

  <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div class="stats" id="statsRow">
    <div class="stat">Correct: <span id="statCorrect">0</span></div>
    <div class="stat">Attempted: <span id="statAttempted">0</span></div>
    <div class="stat">Streak: <span id="statStreak">0</span></div>
  </div>
  <div id="mainArea"></div>
</div>

<script>
const polyatomicIons = [
  {name:'ammonium', formula:'NH&#x2084;', formulaRaw:'NH4', charge:'+1', chargeNum:1},
  {name:'hydroxide', formula:'OH', formulaRaw:'OH', charge:'&#x207B;', chargeNum:-1},
  {name:'nitrate', formula:'NO&#x2083;', formulaRaw:'NO3', charge:'&#x207B;', chargeNum:-1},
  {name:'nitrite', formula:'NO&#x2082;', formulaRaw:'NO2', charge:'&#x207B;', chargeNum:-1},
  {name:'sulfate', formula:'SO&#x2084;', formulaRaw:'SO4', charge:'&#xB2;&#x207B;', chargeNum:-2},
  {name:'sulfite', formula:'SO&#x2083;', formulaRaw:'SO3', charge:'&#xB2;&#x207B;', chargeNum:-2},
  {name:'carbonate', formula:'CO&#x2083;', formulaRaw:'CO3', charge:'&#xB2;&#x207B;', chargeNum:-2},
  {name:'bicarbonate', formula:'HCO&#x2083;', formulaRaw:'HCO3', charge:'&#x207B;', chargeNum:-1},
  {name:'phosphate', formula:'PO&#x2084;', formulaRaw:'PO4', charge:'&#xB3;&#x207B;', chargeNum:-3},
  {name:'permanganate', formula:'MnO&#x2084;', formulaRaw:'MnO4', charge:'&#x207B;', chargeNum:-1},
  {name:'perchlorate', formula:'ClO&#x2084;', formulaRaw:'ClO4', charge:'&#x207B;', chargeNum:-1},
  {name:'chlorate', formula:'ClO&#x2083;', formulaRaw:'ClO3', charge:'&#x207B;', chargeNum:-1},
  {name:'chlorite', formula:'ClO&#x2082;', formulaRaw:'ClO2', charge:'&#x207B;', chargeNum:-1},
  {name:'hypochlorite', formula:'ClO', formulaRaw:'ClO', charge:'&#x207B;', chargeNum:-1},
  {name:'chromate', formula:'CrO&#x2084;', formulaRaw:'CrO4', charge:'&#xB2;&#x207B;', chargeNum:-2},
  {name:'dichromate', formula:'Cr&#x2082;O&#x2087;', formulaRaw:'Cr2O7', charge:'&#xB2;&#x207B;', chargeNum:-2},
  {name:'acetate', formula:'CH&#x2083;COO', formulaRaw:'CH3COO', charge:'&#x207B;', chargeNum:-1},
];

const ionicQ = [
  {formula:'K&#x2082;S', formulaRaw:'K2S', name:'potassium sulfide', type:'ionic'},
  {formula:'MgO', formulaRaw:'MgO', name:'magnesium oxide', type:'ionic'},
  {formula:'NaCl', formulaRaw:'NaCl', name:'sodium chloride', type:'ionic'},
  {formula:'CaBr&#x2082;', formulaRaw:'CaBr2', name:'calcium bromide', type:'ionic'},
  {formula:'Li&#x2082;O', formulaRaw:'Li2O', name:'lithium oxide', type:'ionic'},
  {formula:'AlCl&#x2083;', formulaRaw:'AlCl3', name:'aluminum chloride', type:'ionic'},
  {formula:'Mg&#x2083;N&#x2082;', formulaRaw:'Mg3N2', name:'magnesium nitride', type:'ionic'},
  {formula:'BaF&#x2082;', formulaRaw:'BaF2', name:'barium fluoride', type:'ionic'},
  {formula:'Sr&#x2083;N&#x2082;', formulaRaw:'Sr3N2', name:'strontium nitride', type:'ionic'},
  {formula:'Rb&#x2083;P', formulaRaw:'Rb3P', name:'rubidium phosphide', type:'ionic'},
  {formula:'BeF&#x2082;', formulaRaw:'BeF2', name:'beryllium fluoride', type:'ionic'},
  {formula:'Li&#x2083;N', formulaRaw:'Li3N', name:'lithium nitride', type:'ionic'},
  {formula:'CaO', formulaRaw:'CaO', name:'calcium oxide', type:'ionic'},
  {formula:'KI', formulaRaw:'KI', name:'potassium iodide', type:'ionic'},
  {formula:'SrS', formulaRaw:'SrS', name:'strontium sulfide', type:'ionic'},
  {formula:'AlBr&#x2083;', formulaRaw:'AlBr3', name:'aluminum bromide', type:'ionic'},
  {formula:'MnO', formulaRaw:'MnO', name:'manganese(II) oxide', type:'ionic'},
  {formula:'FeO', formulaRaw:'FeO', name:'iron(II) oxide', type:'ionic'},
  {formula:'Fe&#x2082;O&#x2083;', formulaRaw:'Fe2O3', name:'iron(III) oxide', type:'ionic'},
  {formula:'CuCl', formulaRaw:'CuCl', name:'copper(I) chloride', type:'ionic'},
  {formula:'CuCl&#x2082;', formulaRaw:'CuCl2', name:'copper(II) chloride', type:'ionic'},
  {formula:'SnS', formulaRaw:'SnS', name:'tin(II) sulfide', type:'ionic'},
  {formula:'PbO&#x2082;', formulaRaw:'PbO2', name:'lead(IV) oxide', type:'ionic'},
  {formula:'MnF&#x2084;', formulaRaw:'MnF4', name:'manganese(IV) fluoride', type:'ionic'},
  {formula:'Ni&#x2083;P&#x2082;', formulaRaw:'Ni3P2', name:'nickel(II) phosphide', type:'ionic'},
  {formula:'PbCl&#x2082;', formulaRaw:'PbCl2', name:'lead(II) chloride', type:'ionic'},
  {formula:'MoO&#x2082;', formulaRaw:'MoO2', name:'molybdenum(IV) oxide', type:'ionic'},
  {formula:'V&#x2082;O&#x2085;', formulaRaw:'V2O5', name:'vanadium(V) oxide', type:'ionic'},
  {formula:'SnO', formulaRaw:'SnO', name:'tin(II) oxide', type:'ionic'},
  {formula:'Ag&#x2082;S', formulaRaw:'Ag2S', name:'silver sulfide', type:'ionic'},
];

const covalentQ = [
  {formula:'CO&#x2082;', formulaRaw:'CO2', name:'carbon dioxide', type:'covalent'},
  {formula:'N&#x2082;O&#x2085;', formulaRaw:'N2O5', name:'dinitrogen pentoxide', type:'covalent'},
  {formula:'PCl&#x2083;', formulaRaw:'PCl3', name:'phosphorus trichloride', type:'covalent'},
  {formula:'BF&#x2083;', formulaRaw:'BF3', name:'boron trifluoride', type:'covalent'},
  {formula:'SO&#x2082;', formulaRaw:'SO2', name:'sulfur dioxide', type:'covalent'},
  {formula:'NO', formulaRaw:'NO', name:'nitrogen monoxide', type:'covalent'},
  {formula:'CCl&#x2084;', formulaRaw:'CCl4', name:'carbon tetrachloride', type:'covalent'},
  {formula:'N&#x2082;O', formulaRaw:'N2O', name:'dinitrogen monoxide', type:'covalent'},
  {formula:'SF&#x2086;', formulaRaw:'SF6', name:'sulfur hexafluoride', type:'covalent'},
  {formula:'P&#x2082;O&#x2085;', formulaRaw:'P2O5', name:'diphosphorus pentoxide', type:'covalent'},
  {formula:'SeF&#x2086;', formulaRaw:'SeF6', name:'selenium hexafluoride', type:'covalent'},
  {formula:'NF&#x2083;', formulaRaw:'NF3', name:'nitrogen trifluoride', type:'covalent'},
  {formula:'IF&#x2085;', formulaRaw:'IF5', name:'iodine pentafluoride', type:'covalent'},
  {formula:'N&#x2082;O&#x2083;', formulaRaw:'N2O3', name:'dinitrogen trioxide', type:'covalent'},
  {formula:'P&#x2084;S&#x2085;', formulaRaw:'P4S5', name:'tetraphosphorus pentasulfide', type:'covalent'},
  {formula:'Si&#x2082;Br&#x2086;', formulaRaw:'Si2Br6', name:'disilicon hexabromide', type:'covalent'},
  {formula:'P&#x2084;O&#x2081;&#x2080;', formulaRaw:'P4O10', name:'tetraphosphorus decoxide', type:'covalent'},
  {formula:'CO', formulaRaw:'CO', name:'carbon monoxide', type:'covalent'},
  {formula:'H&#x2082;O', formulaRaw:'H2O', name:'dihydrogen monoxide', type:'covalent'},
  {formula:'CS&#x2082;', formulaRaw:'CS2', name:'carbon disulfide', type:'covalent'},
  {formula:'SBr&#x2082;', formulaRaw:'SBr2', name:'sulfur dibromide', type:'covalent'},
  {formula:'N&#x2082;S&#x2084;', formulaRaw:'N2S4', name:'dinitrogen tetrasulfide', type:'covalent'},
  {formula:'N&#x2082;O&#x2084;', formulaRaw:'N2O4', name:'dinitrogen tetroxide', type:'covalent'},
  {formula:'B&#x2086;Si', formulaRaw:'B6Si', name:'hexaboron monosilicide', type:'covalent'},
  {formula:'ClO&#x2082;', formulaRaw:'ClO2', name:'chlorine dioxide', type:'covalent'},
];

const polyatomicQ = [
  {formula:'LiNO&#x2083;', formulaRaw:'LiNO3', name:'lithium nitrate', type:'polyatomic'},
  {formula:'Al&#x2082;(SO&#x2084;)&#x2083;', formulaRaw:'Al2(SO4)3', name:'aluminum sulfate', type:'polyatomic'},
  {formula:'Ba(ClO&#x2083;)&#x2082;', formulaRaw:'Ba(ClO3)2', name:'barium chlorate', type:'polyatomic'},
  {formula:'(NH&#x2084;)&#x2082;O', formulaRaw:'(NH4)2O', name:'ammonium oxide', type:'polyatomic'},
  {formula:'MgCO&#x2083;', formulaRaw:'MgCO3', name:'magnesium carbonate', type:'polyatomic'},
  {formula:'K&#x2082;SO&#x2083;', formulaRaw:'K2SO3', name:'potassium sulfite', type:'polyatomic'},
  {formula:'NaClO&#x2082;', formulaRaw:'NaClO2', name:'sodium chlorite', type:'polyatomic'},
  {formula:'NH&#x2084;OH', formulaRaw:'NH4OH', name:'ammonium hydroxide', type:'polyatomic'},
  {formula:'K&#x2082;SO&#x2084;', formulaRaw:'K2SO4', name:'potassium sulfate', type:'polyatomic'},
  {formula:'NaMnO&#x2084;', formulaRaw:'NaMnO4', name:'sodium permanganate', type:'polyatomic'},
  {formula:'Mg(NO&#x2083;)&#x2082;', formulaRaw:'Mg(NO3)2', name:'magnesium nitrate', type:'polyatomic'},
  {formula:'NaOH', formulaRaw:'NaOH', name:'sodium hydroxide', type:'polyatomic'},
  {formula:'CaSO&#x2084;', formulaRaw:'CaSO4', name:'calcium sulfate', type:'polyatomic'},
  {formula:'Na&#x2083;PO&#x2084;', formulaRaw:'Na3PO4', name:'sodium phosphate', type:'polyatomic'},
  {formula:'(NH&#x2084;)&#x2083;PO&#x2084;', formulaRaw:'(NH4)3PO4', name:'ammonium phosphate', type:'polyatomic'},
  {formula:'Ba(NO&#x2082;)&#x2082;', formulaRaw:'Ba(NO2)2', name:'barium nitrite', type:'polyatomic'},
  {formula:'(NH&#x2084;)&#x2082;SO&#x2084;', formulaRaw:'(NH4)2SO4', name:'ammonium sulfate', type:'polyatomic'},
  {formula:'Al&#x2082;(CO&#x2083;)&#x2083;', formulaRaw:'Al2(CO3)3', name:'aluminum carbonate', type:'polyatomic'},
  {formula:'Fe(OH)&#x2083;', formulaRaw:'Fe(OH)3', name:'iron(III) hydroxide', type:'polyatomic'},
  {formula:'KNO&#x2083;', formulaRaw:'KNO3', name:'potassium nitrate', type:'polyatomic'},
  {formula:'Fe(NO&#x2083;)&#x2083;', formulaRaw:'Fe(NO3)3', name:'iron(III) nitrate', type:'polyatomic'},
  {formula:'K&#x2082;Cr&#x2082;O&#x2087;', formulaRaw:'K2Cr2O7', name:'potassium dichromate', type:'polyatomic'},
  {formula:'BaSO&#x2084;', formulaRaw:'BaSO4', name:'barium sulfate', type:'polyatomic'},
  {formula:'Mg(CH&#x2083;COO)&#x2082;', formulaRaw:'Mg(CH3COO)2', name:'magnesium acetate', type:'polyatomic'},
  {formula:'CaCO&#x2083;', formulaRaw:'CaCO3', name:'calcium carbonate', type:'polyatomic'},
  {formula:'Mg(OH)&#x2082;', formulaRaw:'Mg(OH)2', name:'magnesium hydroxide', type:'polyatomic'},
  {formula:'NH&#x2084;Cl', formulaRaw:'NH4Cl', name:'ammonium chloride', type:'polyatomic'},
  {formula:'K&#x2082;CrO&#x2084;', formulaRaw:'K2CrO4', name:'potassium chromate', type:'polyatomic'},
  {formula:'Cu(NO&#x2083;)&#x2082;', formulaRaw:'Cu(NO3)2', name:'copper(II) nitrate', type:'polyatomic'},
  {formula:'CuCO&#x2083;', formulaRaw:'CuCO3', name:'copper(II) carbonate', type:'polyatomic'},
  {formula:'Pb&#x2083;(PO&#x2084;)&#x2082;', formulaRaw:'Pb3(PO4)2', name:'lead(II) phosphate', type:'polyatomic'},
  {formula:'Ni(ClO&#x2082;)&#x2082;', formulaRaw:'Ni(ClO2)2', name:'nickel(II) chlorite', type:'polyatomic'},
];

const allQ = [...ionicQ, ...covalentQ, ...polyatomicQ];

let mode = 'formula-to-name';
let category = 'all';
let correct = 0, attempted = 0, streak = 0;
let currentQ = null;
let qPool = [], qIndex = 0;
let fcIndex = 0;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getPool() {
  if (category === 'ionic') return shuffle(ionicQ);
  if (category === 'covalent') return shuffle(covalentQ);
  if (category === 'polyatomic') return shuffle(polyatomicQ);
  return shuffle(allQ);
}

function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach((b, i) => {
    b.classList.toggle('active', ['formula-to-name','name-to-formula','polyatomic','ionic-or-covalent','flashcards','reference'][i] === m);
  });
  const hide = m === 'reference' || m === 'flashcards';
  document.getElementById('progressBar').style.display = hide ? 'none' : '';
  document.getElementById('statsRow').style.display = hide ? 'none' : '';
  document.getElementById('categoryRow').style.display = m === 'reference' ? 'none' : '';
  correct = 0; attempted = 0; streak = 0;
  updateStats();
  qPool = getPool(); qIndex = 0; fcIndex = 0;
  render();
}

function setCategory(c) {
  category = c;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('cat-' + c).classList.add('active');
  qPool = getPool(); qIndex = 0;
  correct = 0; attempted = 0; streak = 0;
  updateStats();
  render();
}

function updateStats() {
  document.getElementById('statCorrect').textContent = correct;
  document.getElementById('statAttempted').textContent = attempted;
  document.getElementById('statStreak').textContent = streak;
  const pct = attempted > 0 ? Math.round((correct / attempted) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
}

function nextQ() {
  if (!qPool.length) qPool = getPool();
  currentQ = qPool[qIndex % qPool.length];
  qIndex++;
  return currentQ;
}

function normalize(s) {
  return s.toLowerCase()
    .replace(/\s+/g, ' ').trim()
    .replace(/[₀₁₂₃₄₅₆₇₈₉]/g, m => '0123456789'['₀₁₂₃₄₅₆₇₈₉'.indexOf(m)])
    .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g, m => '0123456789'['⁰¹²³⁴⁵⁶⁷⁸⁹'.indexOf(m)])
    .replace(/&#x2080;/g,'0').replace(/&#x2081;/g,'1').replace(/&#x2082;/g,'2')
    .replace(/&#x2083;/g,'3').replace(/&#x2084;/g,'4').replace(/&#x2085;/g,'5')
    .replace(/&#x2086;/g,'6').replace(/&#x2087;/g,'7').replace(/&#x2088;/g,'8').replace(/&#x2089;/g,'9')
    .replace(/[⁺+]/g, '+').replace(/[⁻-]/g, '-')
    .replace(/\(|\)/g, '');
}

function checkAnswer(userVal, correct) {
  const u = normalize(userVal);
  const c = normalize(correct);
  if (u === c) return true;
  const alt = normalize(correct).replace(/\(i\)/gi,'(i)');
  return u === alt;
}

function insertSub(inp, text) {
  const pos = inp.selectionStart || inp.value.length;
  inp.value = inp.value.slice(0, pos) + text + inp.value.slice(inp.selectionEnd || pos);
  inp.selectionStart = inp.selectionEnd = pos + text.length;
  inp.focus();
}

function subToolbarHTML(id) {
  const chars = ['₀','₁','₂','₃','₄','₅','₆','₇','₈','₉','⁺','⁻','¹','²','³'];
  return '<div class="sub-toolbar">' + chars.map(c =>
    `<button class="sub-btn" type="button" onclick="insertSub(document.getElementById('${id}'),'${c}')">${c}</button>`
  ).join('') + '</div>';
}

function typeBadge(type) {
  const map = {ionic:'badge-ionic',covalent:'badge-covalent',polyatomic:'badge-polyatomic'};
  const label = {ionic:'Binary ionic', covalent:'Binary covalent', polyatomic:'Polyatomic'};
  return `<span class="type-badge ${map[type]}">${label[type]}</span>`;
}

function render() {
  const area = document.getElementById('mainArea');
  if (mode === 'formula-to-name') renderFTN(area);
  else if (mode === 'name-to-formula') renderNTF(area);
  else if (mode === 'polyatomic') renderPoly(area);
  else if (mode === 'ionic-or-covalent') renderIOC(area);
  else if (mode === 'flashcards') renderFC(area);
  else if (mode === 'reference') renderRef(area);
}

function renderFTN(area) {
  const q = nextQ();
  area.innerHTML = `
    <div class="question-card">
      ${typeBadge(q.type)}
      <div class="q-label" style="margin-top:8px;">Write the name</div>
      <div class="chem-display">${q.formula}</div>
      <div class="hint">Type the full compound name. For transition metals, include the Roman numeral — e.g. <em>iron(III) oxide</em>.</div>
      <input class="text-input" id="ftnIn" placeholder="e.g. calcium chloride" onkeydown="if(event.key==='Enter')submitFTN()" />
      <div class="btn-row">
        <button class="btn primary" onclick="submitFTN()">Check ↵</button>
        <button class="btn" onclick="render()">Skip</button>
      </div>
      <div id="ftnRes"></div>
    </div>`;
  setTimeout(() => { const el = document.getElementById('ftnIn'); if(el) el.focus(); }, 30);
}

function submitFTN() {
  const inp = document.getElementById('ftnIn');
  if (!inp || !inp.value.trim()) return;
  const ok = checkAnswer(inp.value.trim(), currentQ.name);
  attempted++; if (ok) { correct++; streak++; } else streak = 0;
  updateStats();
  inp.disabled = true;
  const res = document.getElementById('ftnRes');
  if (ok) {
    res.innerHTML = '<div class="result-banner result-correct"><i class="ti ti-check"></i> Correct!</div>';
    setTimeout(render, 1500);
  } else {
    res.innerHTML = `<div class="result-banner result-wrong"><i class="ti ti-x"></i> Not quite.<div class="result-answer">${currentQ.name}</div></div>`;
    document.querySelector('.btn.primary').textContent = 'Next →';
    document.querySelector('.btn.primary').onclick = render;
  }
}

function renderNTF(area) {
  const q = nextQ();
  area.innerHTML = `
    <div class="question-card">
      ${typeBadge(q.type)}
      <div class="q-label" style="margin-top:8px;">Write the formula</div>
      <div class="name-display">${q.name}</div>
      <div class="hint">Use the buttons below to insert subscripts/superscripts. Include parentheses where needed, e.g. <em>Ba(NO&#x2082;)&#x2082;</em>.</div>
      ${subToolbarHTML('ntfIn')}
      <input class="chem-input" id="ntfIn" placeholder="e.g. CaCl&#x2082;" onkeydown="if(event.key==='Enter')submitNTF()" />
      <div class="btn-row">
        <button class="btn primary" onclick="submitNTF()">Check ↵</button>
        <button class="btn" onclick="render()">Skip</button>
      </div>
      <div id="ntfRes"></div>
    </div>`;
  setTimeout(() => { const el = document.getElementById('ntfIn'); if(el) el.focus(); }, 30);
}

function submitNTF() {
  const inp = document.getElementById('ntfIn');
  if (!inp || !inp.value.trim()) return;
  const ok = checkAnswer(inp.value.trim(), currentQ.formulaRaw);
  attempted++; if (ok) { correct++; streak++; } else streak = 0;
  updateStats();
  inp.disabled = true;
  const res = document.getElementById('ntfRes');
  if (ok) {
    res.innerHTML = '<div class="result-banner result-correct"><i class="ti ti-check"></i> Correct!</div>';
    setTimeout(render, 1500);
  } else {
    res.innerHTML = `<div class="result-banner result-wrong"><i class="ti ti-x"></i> Not quite.<div class="result-answer">${currentQ.formula}</div></div>`;
    document.querySelector('.btn.primary').textContent = 'Next →';
    document.querySelector('.btn.primary').onclick = render;
  }
}

function renderPoly(area) {
  const ions = shuffle([...polyatomicIons]);
  const q = ions[0];
  currentQ = q;
  const nameToFormula = Math.random() < 0.5;
  area.innerHTML = `
    <div class="question-card">
      <span class="type-badge badge-polyatomic">Polyatomic ion</span>
      ${nameToFormula ? `
        <div class="q-label" style="margin-top:8px;">Formula + charge for this ion</div>
        <div class="name-display">${q.name}</div>
        <div class="hint">Include the full formula and charge, e.g. <em>NO&#x2083;&#x207B;</em> or <em>NH&#x2084;&#x207A;</em></div>
        ${subToolbarHTML('polyIn')}
        <input class="chem-input" id="polyIn" placeholder="formula + charge" onkeydown="if(event.key==='Enter')submitPolyFTN()" />
      ` : `
        <div class="q-label" style="margin-top:8px;">Name this polyatomic ion</div>
        <div class="chem-display">${q.formula}<sup style="font-size:0.55em;">${q.charge}</sup></div>
        <div class="hint">Type the ion name only.</div>
        <input class="text-input" id="polyIn" placeholder="ion name" onkeydown="if(event.key==='Enter')submitPolyNTF()" />
      `}
      <div class="btn-row" style="margin-top:4px;">
        <button class="btn primary" onclick="${nameToFormula ? 'submitPolyFTN' : 'submitPolyNTF'}()">Check ↵</button>
        <button class="btn" onclick="renderPoly(document.getElementById('mainArea'))">Skip</button>
      </div>
      <div id="polyRes"></div>
    </div>`;
  setTimeout(() => { const el = document.getElementById('polyIn'); if(el) el.focus(); }, 30);
}

function submitPolyFTN() {
  const inp = document.getElementById('polyIn');
  if (!inp || !inp.value.trim()) return;
  const expected = currentQ.formulaRaw + currentQ.charge.replace(/&#x207B;/g,'-').replace(/&#x207A;/g,'+').replace(/&#xB2;/g,'2').replace(/&#xB3;/g,'3');
  const ok = checkAnswer(inp.value.trim(), expected);
  attempted++; if (ok) { correct++; streak++; } else streak = 0;
  updateStats();
  inp.disabled = true;
  const res = document.getElementById('polyRes');
  if (ok) {
    res.innerHTML = '<div class="result-banner result-correct"><i class="ti ti-check"></i> Correct!</div>';
    setTimeout(() => renderPoly(document.getElementById('mainArea')), 1500);
  } else {
    res.innerHTML = `<div class="result-banner result-wrong"><i class="ti ti-x"></i> Not quite.<div class="result-answer">${currentQ.formula}<sup>${currentQ.charge}</sup></div></div>`;
    document.querySelector('.btn.primary').textContent = 'Next →';
    document.querySelector('.btn.primary').onclick = () => renderPoly(document.getElementById('mainArea'));
  }
}

function submitPolyNTF() {
  const inp = document.getElementById('polyIn');
  if (!inp || !inp.value.trim()) return;
  const ok = checkAnswer(inp.value.trim(), currentQ.name);
  attempted++; if (ok) { correct++; streak++; } else streak = 0;
  updateStats();
  inp.disabled = true;
  const res = document.getElementById('polyRes');
  if (ok) {
    res.innerHTML = '<div class="result-banner result-correct"><i class="ti ti-check"></i> Correct!</div>';
    setTimeout(() => renderPoly(document.getElementById('mainArea')), 1500);
  } else {
    res.innerHTML = `<div class="result-banner result-wrong"><i class="ti ti-x"></i> Not quite.<div class="result-answer">${currentQ.name}</div></div>`;
    document.querySelector('.btn.primary').textContent = 'Next →';
    document.querySelector('.btn.primary').onclick = () => renderPoly(document.getElementById('mainArea'));
  }
}

function renderIOC(area) {
  const pool = shuffle([...ionicQ, ...covalentQ]);
  currentQ = pool[0];
  area.innerHTML = `
    <div class="question-card">
      <div class="q-label">Ionic or covalent?</div>
      <div class="chem-display">${currentQ.formula}</div>
      <div class="hint">Ionic = metal + nonmetal &nbsp;·&nbsp; Covalent = only nonmetals. Transition metals in ionic always get Roman numerals.</div>
      <div class="btn-row">
        <button class="btn" onclick="submitIOC('ionic')">Ionic</button>
        <button class="btn" onclick="submitIOC('covalent')">Covalent</button>
      </div>
      <div id="iocRes"></div>
    </div>`;
}

function submitIOC(guess) {
  const ok = guess === currentQ.type;
  attempted++; if (ok) { correct++; streak++; } else streak = 0;
  updateStats();
  document.querySelectorAll('#mainArea .btn').forEach(b => b.disabled = true);
  const res = document.getElementById('iocRes');
  if (ok) {
    res.innerHTML = `<div class="result-banner result-correct"><i class="ti ti-check"></i> Correct! &nbsp;<strong>${currentQ.formula}</strong> is ${currentQ.type} — <em>${currentQ.name}</em>.</div>`;
    setTimeout(() => renderIOC(document.getElementById('mainArea')), 2000);
  } else {
    res.innerHTML = `<div class="result-banner result-wrong"><i class="ti ti-x"></i> Not quite — <strong>${currentQ.formula}</strong> is ${currentQ.type} (<em>${currentQ.name}</em>).</div>`;
    const nb = document.createElement('button');
    nb.className = 'btn primary'; nb.textContent = 'Next →'; nb.style.marginTop = '10px';
    nb.onclick = () => renderIOC(document.getElementById('mainArea'));
    res.appendChild(nb);
  }
}

function renderFC(area) {
  const pool = getPool();
  const q = pool[fcIndex % pool.length];
  const showFormula = Math.random() < 0.5;
  area.innerHTML = `
    <div class="flashcard" id="fcFront" onclick="revealFC('${showFormula ? q.name.replace(/'/g,"\\'") : q.formulaRaw}', '${showFormula ? 'Name' : 'Formula'}', '${q.type}')">
      <div class="fc-label">${showFormula ? 'Formula' : 'Name'} — tap to reveal</div>
      <div class="${showFormula ? 'fc-content' : 'fc-name'}">${showFormula ? q.formula : q.name}</div>
      <div class="fc-hint">${typeBadge(q.type)}</div>
    </div>
    <div class="fc-back" id="fcBack">
      <div class="fc-back-label" id="fcBackLabel"></div>
      <div class="fc-back-content" id="fcBackContent"></div>
    </div>
    <div class="btn-row" style="justify-content:center;margin-top:4px;">
      <button class="btn" onclick="fcNav(-1)">← Prev</button>
      <button class="btn primary" onclick="fcNav(1)">Next →</button>
    </div>`;
}

function revealFC(answer, label, type) {
  document.getElementById('fcBack').classList.add('shown');
  document.getElementById('fcBackLabel').textContent = label;
  document.getElementById('fcBackContent').textContent = answer;
}
function fcNav(d) { fcIndex = Math.max(0, fcIndex + d); renderFC(document.getElementById('mainArea')); }

function renderRef(area) {
  area.innerHTML = `
    <div class="tab-row">
      <button class="tab active" id="tab-poly" onclick="switchRef('poly')">Polyatomic ions</button>
      <button class="tab" id="tab-rules" onclick="switchRef('rules')">Naming rules</button>
      <button class="tab" id="tab-prefixes" onclick="switchRef('prefixes')">Prefixes</button>
    </div>
    <div id="refContent"></div>`;
  switchRef('poly');
}

function switchRef(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  const c = document.getElementById('refContent');
  if (tab === 'poly') {
    c.innerHTML = '<div class="poly-grid">' + [...polyatomicIons].map(ion =>
      `<div class="poly-card"><div class="pc-name">${ion.name}</div><div class="pc-formula">${ion.formula}<sup style="font-size:0.6em;">${ion.charge}</sup></div></div>`
    ).join('') + '</div>';
  } else if (tab === 'rules') {
    c.innerHTML = `
      <div class="rule-card" style="border-left-color:var(--blue);">
        <h3>Binary ionic compounds</h3>
        <p>1. Name the metal (cation) — name unchanged.<br>
        2. Name the nonmetal (anion) — change ending to <strong>-ide</strong>.<br>
        3. For transition metals, add a Roman numeral in parentheses: <em>iron(III) oxide</em>.<br>
        <strong>No prefixes!</strong></p>
      </div>
      <div class="rule-card" style="border-left-color:var(--green);">
        <h3>Binary covalent compounds</h3>
        <p>1. Name the first nonmetal (skip "mono-" if only 1).<br>
        2. Name the second nonmetal with <strong>-ide</strong> ending.<br>
        3. Add numerical prefixes to both elements.<br>
        4. Drop trailing -o or -a before "oxide": <em>tetroxide</em>, not <em>tetraoxide</em>.</p>
      </div>
      <div class="rule-card" style="border-left-color:var(--amber);">
        <h3>Ionic compounds with polyatomic ions</h3>
        <p>1. Name the cation (metal or ammonium).<br>
        2. Name the polyatomic anion as memorized.<br>
        3. Use parentheses around a polyatomic ion when its subscript &gt; 1: <em>Ba(NO&#x2082;)&#x2082;</em>.<br>
        4. Transition metals still need Roman numerals.</p>
      </div>
      <div class="rule-card" style="border-left-color:var(--border-strong);">
        <h3>-ide vs -ate vs -ite</h3>
        <p><strong>-ide</strong> = single-element anion (chloride, sulfide, nitride)<br>
        <strong>-ate</strong> = polyatomic ion, more oxygens (sulfate SO&#x2084;²⁻, nitrate NO&#x2083;⁻)<br>
        <strong>-ite</strong> = polyatomic ion, fewer oxygens (sulfite SO&#x2083;²⁻, nitrite NO&#x2082;⁻)</p>
      </div>`;
  } else {
    const prefs = [['mono-','1'],['di-','2'],['tri-','3'],['tetra-','4'],['penta-','5'],['hexa-','6'],['hepta-','7'],['octa-','8'],['nona-','9'],['deca-','10']];
    c.innerHTML = '<div class="prefix-grid">' + prefs.map(([p,n]) =>
      `<div class="prefix-item"><span class="pref">${p}</span><span class="num">${n}</span></div>`
    ).join('') + '</div><div class="notice">⚠ Never use mono- on the first element. Remove trailing -o or -a before "oxide" — <em>tetroxide</em> not <em>tetraoxide</em>.</div>';
  }
}

setMode('formula-to-name');
</script>
