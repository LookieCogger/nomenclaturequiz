<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Chemistry Nomenclature</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f4f0;--sf:#fff;--s2:#eeeee8;--s3:#e2e2da;
  --bd:rgba(0,0,0,.1);--bds:rgba(0,0,0,.2);
  --tx:#18180f;--t2:#55554e;--t3:#88887f;
  --blue:#1a5fa8;--blbg:#e4eefa;--bltx:#0b3f7a;
  --gn:#2e6b0a;--gnbg:#e6f2d8;--gntx:#1a4205;
  --am:#b07010;--ambg:#faebd0;--amtx:#5e3a00;
  --pu:#4a44b0;--pubg:#eceafa;--putx:#2d2878;
  --rd:#9e2020;--rdbg:#fce8e8;--rdtx:#6b0e0e;
  --okbg:#e6f2d8;--oktx:#1a4205;
  --sb:#1c1c1a;--sbt:#b0b0a8;--sbh:#2a2a28;--sba:#363632;
  --r:8px;--rl:12px;--fn:"Sora",sans-serif;--mo:"IBM Plex Mono",monospace
}
@media(prefers-color-scheme:dark){:root{
  --bg:#141412;--sf:#202020;--s2:#282826;--s3:#303030;
  --bd:rgba(255,255,255,.08);--bds:rgba(255,255,255,.18);
  --tx:#f0efe8;--t2:#a0a098;--t3:#68685f;
  --blue:#5a9ae0;--blbg:#0e2a48;--bltx:#90c0f0;
  --gn:#60a030;--gnbg:#0e2808;--gntx:#a0d870;
  --am:#e0a040;--ambg:#2a1a00;--amtx:#f0c870;
  --pu:#9090e8;--pubg:#1a1838;--putx:#c0b8ff;
  --rd:#e05050;--rdbg:#2a0808;--rdtx:#ff9090;
  --okbg:#0e2808;--oktx:#a0d870;
  --sb:#101010;--sbt:#808078;--sbh:#1c1c1a;--sba:#282824
}}
body{font-family:var(--fn);background:var(--bg);color:var(--tx);min-height:100vh}
.shell{display:flex;min-height:100vh}
.sidebar{width:220px;flex-shrink:0;background:var(--sb);display:flex;flex-direction:column;padding:1rem 0;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:100}
.sb-logo{font-size:16px;font-weight:600;color:#fff;padding:0 1rem 1rem}
.sb-logo span{color:#5a9ae0}
.sb-sec{font-size:10px;font-weight:600;color:var(--sbt);letter-spacing:.08em;text-transform:uppercase;padding:.5rem 1rem .2rem}
.sb-btn{display:flex;align-items:center;gap:8px;padding:8px 1rem;background:none;border:none;color:var(--sbt);font-family:var(--fn);font-size:13px;font-weight:500;cursor:pointer;text-align:left;width:100%;transition:background .1s,color .1s}
.sb-btn:hover{background:var(--sbh);color:#fff}
.sb-btn.active{background:var(--sba);color:#fff;border-left:2px solid #5a9ae0}
.sb-icon{font-size:13px;width:16px;text-align:center;flex-shrink:0}
.sb-stats{border-top:.5px solid rgba(255,255,255,.08);margin-top:auto;padding:1rem;display:flex}
.sb-stat{flex:1;text-align:center;font-size:11px;color:var(--sbt)}
.sb-stat b{display:block;font-size:20px;font-weight:600;color:#fff;margin-bottom:2px}
.ham{display:none;position:fixed;top:10px;left:10px;z-index:200;background:var(--sb);color:#fff;border:none;border-radius:var(--r);padding:7px 10px;font-size:17px;cursor:pointer}
@media(max-width:680px){
  .sidebar{position:fixed;left:-220px;transition:left .2s;height:100vh}
  .sidebar.open{left:0}
  .ham{display:block}
  .content{padding-top:3.5rem}
}
.content{flex:1;min-width:0;padding:1.75rem;max-width:700px}
.ph{margin-bottom:1.5rem}
.ph h1{font-size:19px;font-weight:600;margin-bottom:3px}
.ph p{font-size:13px;color:var(--t2)}
.catrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1.25rem}
.cbtn{padding:5px 11px;border:.5px solid var(--bds);border-radius:20px;background:var(--sf);color:var(--t2);font-family:var(--fn);font-size:12px;font-weight:500;cursor:pointer;transition:all .1s;display:flex;align-items:center;gap:5px}
.cbtn:hover{background:var(--s2)}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.da{background:var(--pu)}.di{background:var(--blue)}.dc{background:var(--gn)}.dp{background:var(--am)}
.cbtn.active.ca{background:var(--pubg);color:var(--putx);border-color:var(--pu)}
.cbtn.active.ci{background:var(--blbg);color:var(--bltx);border-color:var(--blue)}
.cbtn.active.cc{background:var(--gnbg);color:var(--gntx);border-color:var(--gn)}
.cbtn.active.cp{background:var(--ambg);color:var(--amtx);border-color:var(--am)}
.card{background:var(--sf);border:.5px solid var(--bd);border-radius:var(--rl);padding:1.5rem;margin-bottom:1rem}
.qlbl{font-size:11px;font-weight:600;color:var(--t3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px}
.bdg{display:inline-block;font-size:11px;padding:2px 9px;border-radius:10px;font-weight:500;margin-bottom:10px}
.bi{background:var(--blbg);color:var(--bltx)}.bc{background:var(--gnbg);color:var(--gntx)}.bp{background:var(--ambg);color:var(--amtx)}
.cdsp{font-family:var(--mo);font-size:26px;font-weight:500;color:var(--tx);margin:.5rem 0 .8rem;line-height:1.3;word-break:break-all}
.ndsp{font-size:19px;font-weight:500;color:var(--tx);margin:.5rem 0 .8rem;line-height:1.4}
.hint{font-size:13px;color:var(--t2);margin-bottom:1rem;line-height:1.6}
.stb{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.sbtn{padding:2px 8px;border:.5px solid var(--bds);border-radius:20px;background:var(--s2);color:var(--t2);font-family:var(--mo);font-size:12px;cursor:pointer;line-height:1.7}
.sbtn:hover{border-color:var(--blue);color:var(--tx)}
.ti,.ci{width:100%;font-size:15px;font-family:var(--fn);border:.5px solid var(--bds);border-radius:var(--r);padding:10px 13px;background:var(--sf);color:var(--tx);outline:none;margin-bottom:10px;transition:border-color .15s,box-shadow .15s}
.ci{font-family:var(--mo)}
.ti:focus,.ci:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,95,168,.12)}
.ti:disabled,.ci:disabled{opacity:.5;cursor:not-allowed}
.brow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn{padding:8px 17px;border:.5px solid var(--bds);border-radius:var(--r);background:var(--sf);color:var(--tx);font-family:var(--fn);font-size:13px;font-weight:500;cursor:pointer;transition:background .1s}
.btn:hover{background:var(--s2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.pri{background:var(--blbg);color:var(--bltx);border-color:var(--blue)}
.pri:hover{opacity:.82}
.grn{background:var(--gnbg);color:var(--gntx);border-color:var(--gn)}
.rs{padding:12px 16px;border-radius:var(--r);margin-top:12px;font-size:14px;line-height:1.6}
.ok{background:var(--okbg);color:var(--oktx)}.bad{background:var(--rdbg);color:var(--rdtx)}
.rans{margin-top:5px;font-weight:600;font-family:var(--mo);font-size:15px}
.mopts{display:flex;flex-direction:column;gap:7px;margin-top:6px}
.mopt{padding:11px 14px;border:.5px solid var(--bds);border-radius:var(--r);background:var(--sf);color:var(--tx);font-family:var(--fn);font-size:14px;cursor:pointer;text-align:left;transition:background .1s}
.mopt:hover:not(:disabled){background:var(--s2)}
.mopt.correct{background:var(--okbg);color:var(--oktx);border-color:var(--gn)}
.mopt.wrong{background:var(--rdbg);color:var(--rdtx);border-color:var(--rd)}
.mopt.reveal{background:var(--okbg);color:var(--oktx);border-color:var(--gn)}
.fc-card{background:var(--sf);border:.5px solid var(--bd);border-radius:var(--rl);padding:2.5rem 1.5rem;margin-bottom:1rem;text-align:center;cursor:pointer;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .15s;user-select:none}
.fc-card:hover{background:var(--s2)}
.fclbl{font-size:11px;color:var(--t3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}
.fcc{font-size:26px;font-weight:500;font-family:var(--mo);color:var(--tx);line-height:1.3}
.fcn{font-size:20px;font-weight:500;color:var(--tx)}
.fcbk{text-align:center;margin-bottom:1rem;display:none}
.fcbk.on{display:block}
.fcbkl{font-size:12px;color:var(--t3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.fcbkc{font-size:22px;font-weight:500;font-family:var(--mo);color:var(--tx)}
.ptbl{width:100%;border-collapse:collapse;margin-bottom:1rem}
.ptbl th{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;text-align:left;border-bottom:.5px solid var(--bd)}
.ptbl td{padding:7px 10px;border-bottom:.5px solid var(--bd);font-size:13px;vertical-align:middle}
.ptbl tr:last-child td{border-bottom:none}
.ptbl tr:hover td{background:var(--s2)}
.pti{width:100%;font-size:12px;font-family:var(--mo);border:.5px solid var(--bds);border-radius:5px;padding:4px 7px;background:var(--sf);color:var(--tx);outline:none}
.pti:focus{border-color:var(--blue)}
.pti.ok{background:var(--okbg);color:var(--oktx);border-color:var(--gn)}
.pti.bad{background:var(--rdbg);color:var(--rdtx);border-color:var(--rd)}
.cbrow{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:1rem;align-items:center}
.cblbl{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;cursor:pointer;user-select:none}
.cblbl input{width:15px;height:15px;cursor:pointer;accent-color:var(--blue)}
.tabrow{display:flex;gap:0;border-bottom:.5px solid var(--bd);margin-bottom:1.25rem;overflow-x:auto;scrollbar-width:none}
.tabrow::-webkit-scrollbar{display:none}
.tab{padding:9px 14px;font-size:13px;font-family:var(--fn);cursor:pointer;color:var(--t2);border-bottom:2px solid transparent;margin-bottom:-1px;background:none;border-top:none;border-left:none;border-right:none;white-space:nowrap}
.tab:hover{color:var(--tx)}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.rcard{background:var(--sf);border:.5px solid var(--bd);border-radius:var(--rl);padding:1rem 1.25rem;margin-bottom:10px;border-left-width:3px}
.rcard h3{font-size:14px;font-weight:600;margin-bottom:8px}
.rcard p{font-size:13px;color:var(--t2);line-height:1.8}
.rcard strong{color:var(--tx);font-weight:600}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.pitm{background:var(--s2);border:.5px solid var(--bd);border-radius:var(--r);padding:8px 13px;display:flex;justify-content:space-between;align-items:center}
.pref-n{font-family:var(--mo);font-weight:500;font-size:14px}
.pref-d{color:var(--t2);font-size:13px}
.notice{margin-top:12px;font-size:13px;color:var(--amtx);background:var(--ambg);border-radius:var(--r);padding:10px 14px;line-height:1.6}
.prgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(max-width:480px){.prgrid{grid-template-columns:1fr}}
.prc{background:var(--s2);border-radius:var(--r);padding:10px 12px;border:.5px solid var(--bd)}
.prcn{font-size:13px;font-weight:500}
.prcf{font-size:13px;font-family:var(--mo);color:var(--blue);margin-top:3px}
.qhdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:6px}
.qcard{background:var(--sf);border:.5px solid var(--bd);border-radius:var(--rl);padding:1.25rem;margin-bottom:12px}
.qcdsp{font-family:var(--mo);font-size:20px;font-weight:500;margin:.4rem 0 .7rem;word-break:break-all}
.qndsp{font-size:16px;font-weight:500;margin:.4rem 0 .7rem}
.qinput{width:100%;font-size:14px;font-family:var(--fn);border:.5px solid var(--bds);border-radius:var(--r);padding:8px 12px;background:var(--sf);color:var(--tx);outline:none;transition:border-color .15s}
.qinput:focus{border-color:var(--blue)}
.qinput.mono{font-family:var(--mo)}
.qsum{background:var(--sf);border:.5px solid var(--bd);border-radius:var(--rl);padding:2rem;text-align:center}
.qbdg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:1rem 0 1.5rem}
.qbd{background:var(--s2);border-radius:var(--r);padding:12px;text-align:center}
.qbdn{font-size:22px;font-weight:600;margin-bottom:2px}
.qbdl{font-size:11px;color:var(--t2)}
.qs-sec{margin-top:1.5rem}
.qs-sec h3{font-size:14px;font-weight:600;margin-bottom:.75rem}
.qs-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:var(--r);margin-bottom:4px;font-size:12px;flex-wrap:wrap;gap:4px}
.qs-item.ok{background:var(--okbg)}.qs-item.bad{background:var(--rdbg)}
.qs-q{font-family:var(--mo);font-weight:500}
.qs-a{color:var(--oktx);font-weight:600}
.qs-w{color:var(--rdtx)}
.lcard{background:var(--sf);border:.5px solid var(--bd);border-radius:var(--rl);padding:1.5rem;margin-bottom:1rem}
.lcard h2{font-size:17px;font-weight:600;margin-bottom:.6rem}
.lcard p{font-size:13px;color:var(--t2);line-height:1.8;margin-bottom:.75rem}
.lcard .ex{background:var(--s2);border-radius:var(--r);padding:10px 14px;font-size:13px;margin:.5rem 0;border-left:3px solid var(--blue);line-height:1.7}
.lcard .exlbl{font-size:10px;font-weight:600;color:var(--t3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.step{display:flex;gap:10px;margin:.4rem 0;font-size:13px;color:var(--t2);line-height:1.6}
.stepn{width:20px;height:20px;border-radius:50%;background:var(--blbg);color:var(--bltx);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.lgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:1.5rem}
@media(max-width:520px){.lgrid{grid-template-columns:1fr}}
.ltile{background:var(--sf);border:.5px solid var(--bd);border-radius:var(--rl);padding:1.25rem;cursor:pointer;transition:background .1s,border-color .1s;text-align:left;width:100%}
.ltile:hover{background:var(--s2);border-color:var(--bds)}
.ltile .icon{font-size:22px;margin-bottom:8px}
.ltile h3{font-size:14px;font-weight:600;margin-bottom:4px}
.ltile p{font-size:12px;color:var(--t2);line-height:1.5}
.ltile.done{border-color:var(--gn)}
.done-tag{font-size:11px;color:var(--gntx);margin-top:5px;font-weight:600}
.pt-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:flex;align-items:center;justify-content:center;padding:1rem}
.pt-modal{background:var(--sf);border-radius:var(--rl);max-width:98vw;width:880px;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.pt-hdr{display:flex;justify-content:space-between;align-items:center;padding:.7rem 1rem;border-bottom:.5px solid var(--bd);font-weight:600;font-size:15px;position:sticky;top:0;background:var(--sf)}
.pt-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--t2);padding:2px 6px;border-radius:4px}
.pt-close:hover{background:var(--s2)}
.pt-body{padding:.75rem;overflow-x:auto}
.pt-grid{display:grid;grid-template-columns:repeat(18,minmax(30px,1fr));gap:2px;min-width:560px}
.el{border-radius:4px;padding:3px 2px;text-align:center;font-size:9px;line-height:1.3;border:.5px solid transparent}
.el .sym{font-size:11px;font-weight:600;display:block}
.el .anum{font-size:7px;opacity:.7}
.em{background:transparent;border:none}
.me{background:#ddeeff;color:#0a3a6a;border-color:#aaccee}
.tm{background:#ffe8cc;color:#5a2800;border-color:#ffcc88}
.nm{background:#d8f5d0;color:#1a4a10;border-color:#aaddaa}
.ng{background:#f0e0ff;color:#3a0878;border-color:#cc99ee}
.ml{background:#fff0cc;color:#4a3000;border-color:#eedd88}
.hl{background:#ffe0e0;color:#6a0000;border-color:#ffaaaa}
@media(prefers-color-scheme:dark){
  .me{background:#0a2a4a;color:#88ccff;border-color:#1a4a7a}
  .tm{background:#3a1800;color:#ffcc88;border-color:#6a3000}
  .nm{background:#0a2a08;color:#88ee70;border-color:#1a5a10}
  .ng{background:#1a0838;color:#cc99ff;border-color:#4a1888}
  .ml{background:#2a1800;color:#ffdd88;border-color:#5a3800}
  .hl{background:#2a0808;color:#ff8888;border-color:#5a1818}
}
.hidden{display:none!important}
.slbl{font-size:11px;font-weight:600;color:var(--t3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
sup{font-size:.6em;vertical-align:super}
sub{font-size:.6em;vertical-align:sub}
.fcnode{background:var(--sf);border:.5px solid var(--bd);border-radius:var(--r);padding:.5rem .8rem;font-size:12px;display:inline-block;text-align:center;line-height:1.4;max-width:160px}
.fcq{background:var(--pubg);border-color:var(--pu);color:var(--putx);font-weight:500}
.fca{background:var(--gnbg);border-color:var(--gn);color:var(--gntx)}
.fcw{background:var(--ambg);border-color:var(--am);color:var(--amtx)}
.fcarr{font-size:16px;color:var(--t3);text-align:center}
.fcrow{display:flex;align-items:flex-start;justify-content:center;gap:.75rem;margin:.4rem 0;flex-wrap:wrap}
.fccol{display:flex;flex-direction:column;align-items:center;gap:.2rem}
.fclabel{font-size:10px;color:var(--t3)}
</style>
</head>
<body>
<div id="ptOverlay" class="pt-ov hidden" onclick="if(event.target===this)togglePT()">
  <div class="pt-modal">
    <div class="pt-hdr"><span>Periodic Table</span><button class="pt-close" onclick="togglePT()">&#x2715;</button></div>
    <div class="pt-body" id="ptBody"></div>
  </div>
</div>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="sb-logo">Chem<span>Nom</span></div>
    <div class="sb-sec">Study</div>
    <button class="sb-btn active" data-m="learn" onclick="setMode('learn')"><span class="sb-icon">&#x1F9E0;</span>Lessons</button>
    <button class="sb-btn" data-m="ftn" onclick="setMode('ftn')"><span class="sb-icon">&#x2192;</span>Formula to Name</button>
    <button class="sb-btn" data-m="ntf" onclick="setMode('ntf')"><span class="sb-icon">&#x2190;</span>Name to Formula</button>
    <button class="sb-btn" data-m="poly" onclick="setMode('poly')"><span class="sb-icon">&#x26A1;</span>Polyatomic Recall</button>
    <button class="sb-btn" data-m="ioc" onclick="setMode('ioc')"><span class="sb-icon">?</span>Ionic or Covalent</button>
    <button class="sb-btn" data-m="mcq" onclick="setMode('mcq')"><span class="sb-icon">&#x25CE;</span>Multiple Choice</button>
    <button class="sb-btn" data-m="fc" onclick="setMode('fc')"><span class="sb-icon">&#x1F0CF;</span>Flashcards</button>
    <button class="sb-btn" data-m="shuffle" onclick="setMode('shuffle')"><span class="sb-icon">&#x1F500;</span>Shuffle Practice</button>
    <div class="sb-sec" style="margin-top:10px">Test</div>
    <button class="sb-btn" data-m="quiz" onclick="setMode('quiz')"><span class="sb-icon">&#x1F4DD;</span>Quiz (30 Qs)</button>
    <div class="sb-sec" style="margin-top:10px">Reference</div>
    <button class="sb-btn" data-m="polytable" onclick="setMode('polytable')"><span class="sb-icon">&#x25A6;</span>Polyatomic Table</button>
    <button class="sb-btn" data-m="ref" onclick="setMode('ref')"><span class="sb-icon">&#x1F4D6;</span>Reference Sheet</button>
    <button class="sb-btn" onclick="togglePT()"><span class="sb-icon">&#x269B;</span>Periodic Table</button>
    <div class="sb-stats">
      <div class="sb-stat"><b id="sc">0</b>Correct</div>
      <div class="sb-stat"><b id="ss">0</b>Streak</div>
    </div>
  </aside>
  <button class="ham" onclick="document.getElementById('sidebar').classList.toggle('open')">&#9776;</button>
  <main class="content"><div id="main"></div></main>
</div>
<script>
var PI=[
  {n:"ammonium",f:"NH&#x2084;",fr:"NH4",c:"+",cr:"1+"},
  {n:"nitrite",f:"NO&#x2082;",fr:"NO2",c:"&#x207B;",cr:"1-"},
  {n:"nitrate",f:"NO&#x2083;",fr:"NO3",c:"&#x207B;",cr:"1-"},

function getLessonHTML(id){
  if(id==="ions") return "<div class=\"lcard\"><h2>&#x26A1; Ions &amp; Charges</h2><p>Chemical reactions happen when atoms <strong>gain, lose, or share electrons</strong>. Gaining or losing electrons creates <strong>ions</strong>.</p><div class=\"step\"><div class=\"stepn\">1</div><div><strong>Metals lose electrons</strong> &rarr; positive ions called <strong>cations</strong></div></div><div class=\"step\"><div class=\"stepn\">2</div><div><strong>Nonmetals gain electrons</strong> &rarr; negative ions called <strong>anions</strong></div></div><p>Charges from periodic table position:</p><div class=\"ex\"><div class=\"exlbl\">Charges by group</div>Group 1 &rarr; +1 &nbsp;|&nbsp; Group 2 &rarr; +2 &nbsp;|&nbsp; Group 15 &rarr; 3- &nbsp;|&nbsp; Group 16 &rarr; 2- &nbsp;|&nbsp; Group 17 &rarr; 1-</div><p>Naming nonmetal anions: drop element ending, add <strong>-ide</strong></p><div class=\"ex\"><div class=\"exlbl\">Examples</div>chlorine &rarr; chloride &nbsp;|&nbsp; sulfur &rarr; sulfide &nbsp;|&nbsp; oxygen &rarr; oxide &nbsp;|&nbsp; nitrogen &rarr; nitride</div></div>";
  if(id==="ionic") return "<div class=\"lcard\"><h2>&#x1F517; Binary Ionic Compounds</h2><p>Binary ionic = <strong>one metal + one nonmetal</strong>. Charges cancel (net = 0).</p><div class=\"step\"><div class=\"stepn\">1</div><div>Write metal name unchanged</div></div><div class=\"step\"><div class=\"stepn\">2</div><div>Write nonmetal name with <strong>-ide</strong></div></div><div class=\"step\"><div class=\"stepn\">3</div><div><strong>No prefixes.</strong> Done.</div></div><div class=\"ex\"><div class=\"exlbl\">Examples</div>NaCl &rarr; sodium chloride<br>MgO &rarr; magnesium oxide<br>CaBr&#x2082; &rarr; calcium bromide<br>Li&#x2083;N &rarr; lithium nitride</div><p style=\"margin-top:.75rem\"><strong>Writing formulas (crisscross):</strong> swap charge magnitudes as subscripts.</p><div class=\"ex\"><div class=\"exlbl\">Example</div>Ca2+ + Cl1- &rarr; CaCl&#x2082; &nbsp;|&nbsp; Al3+ + O2- &rarr; Al&#x2082;O&#x2083;</div></div>";
  if(id==="trans") return "<div class=\"lcard\"><h2>&#x2699;&#xFE0F; Transition Metals &amp; Roman Numerals</h2><p>Transition metals can have <strong>multiple possible charges</strong>, so we include a <strong>Roman numeral</strong> in the name.</p><div class=\"ex\"><div class=\"exlbl\">Common charges</div>Fe: 2+ or 3+ &nbsp;|&nbsp; Cu: 1+ or 2+ &nbsp;|&nbsp; Sn: 2+ or 4+ &nbsp;|&nbsp; Pb: 2+ or 4+ &nbsp;|&nbsp; Mn: 2+, 4+, 7+</div><div class=\"step\"><div class=\"stepn\">1</div><div>Find total negative charge of all anions</div></div><div class=\"step\"><div class=\"stepn\">2</div><div>Divide by number of metal ions = each metal ion charge</div></div><div class=\"step\"><div class=\"stepn\">3</div><div>Convert to Roman numeral in parentheses</div></div><div class=\"ex\"><div class=\"exlbl\">Example: Fe&#x2082;O&#x2083;</div>3 oxygens &times; 2- = 6- total &nbsp; 6 &divide; 2 iron = 3+ each &rarr; iron(III) oxide</div><div class=\"ex\"><div class=\"exlbl\">Exceptions (no Roman numeral)</div>Ag always 1+ &nbsp;|&nbsp; Zn always 2+ &nbsp;|&nbsp; Cd always 2+</div></div>";
  if(id==="cov") return "<div class=\"lcard\"><h2>&#x1F9EA; Binary Covalent Compounds</h2><p>Two nonmetals sharing electrons. Use <strong>numerical prefixes</strong> because the ratio matters.</p><div class=\"ex\"><div class=\"exlbl\">Prefixes</div>1=mono &nbsp; 2=di &nbsp; 3=tri &nbsp; 4=tetra &nbsp; 5=penta &nbsp; 6=hexa &nbsp; 7=hepta &nbsp; 8=octa &nbsp; 9=nona &nbsp; 10=deca</div><div class=\"step\"><div class=\"stepn\">1</div><div>Name first nonmetal. Skip mono- if only 1.</div></div><div class=\"step\"><div class=\"stepn\">2</div><div>Name second nonmetal with <strong>-ide</strong> + prefix.</div></div><div class=\"step\"><div class=\"stepn\">3</div><div>Drop -a or -o before oxide: tetroxide NOT tetraoxide.</div></div><div class=\"ex\"><div class=\"exlbl\">Examples</div>CO&#x2082; &rarr; carbon dioxide &nbsp;|&nbsp; N&#x2082;O&#x2085; &rarr; dinitrogen pentoxide<br>PCl&#x2083; &rarr; phosphorus trichloride &nbsp;|&nbsp; N&#x2082;O&#x2084; &rarr; dinitrogen tetroxide</div></div>";
  if(id==="poly") return "<div class=\"lcard\"><h2>&#x1F9F2; Polyatomic Ions</h2><p>A <strong>group of atoms carrying a charge as a whole</strong>. Must be memorized.</p><div class=\"ex\"><div class=\"exlbl\">-ate vs -ite</div>More oxygens = -ate: sulfate SO&#x2084;2-, nitrate NO&#x2083;1-<br>Fewer oxygens = -ite: sulfite SO&#x2083;2-, nitrite NO&#x2082;1-</div><div class=\"ex\"><div class=\"exlbl\">Only positive polyatomic ion</div>Ammonium NH&#x2084;+ &mdash; treat like a metal cation</div><div class=\"ex\"><div class=\"exlbl\">Parentheses rule</div>Ca2+ + OH1- &rarr; Ca(OH)&#x2082; &nbsp; parentheses when more than 1 polyatomic ion needed<br>K+ + SO&#x2084;2- &rarr; K&#x2082;SO&#x2084; &nbsp; no parentheses when only 1</div></div>";
  if(id==="flow") return "<div class=\"lcard\"><h2>&#x1F5FA;&#xFE0F; Naming Flowchart</h2><div style=\"display:flex;flex-direction:column;align-items:center;gap:.35rem;padding:.5rem 0\"><div class=\"fcnode fcq\">Does the compound contain a metal?</div><div style=\"display:flex;gap:3rem\"><span style=\"font-size:11px;color:var(--t3)\">YES &darr;</span><span style=\"font-size:11px;color:var(--t3)\">NO &darr;</span></div><div class=\"fcrow\"><div class=\"fccol\"><div class=\"fcnode fcq\">Transition metal?</div><div style=\"display:flex;gap:1.5rem\"><span style=\"font-size:11px;color:var(--t3)\">YES &darr;</span><span style=\"font-size:11px;color:var(--t3)\">NO &darr;</span></div><div class=\"fcrow\"><div class=\"fccol\"><div class=\"fcnode fca\">Metal + Roman numeral + anion name</div></div><div class=\"fccol\"><div class=\"fcnode fca\">Metal + anion name</div></div></div><div class=\"fcnode fcw\" style=\"margin-top:.35rem\">Polyatomic ion? Use its memorized name. Otherwise use -ide ending.</div></div><div class=\"fccol\"><div class=\"fcnode fcq\">Binary covalent</div><div class=\"fcarr\">&darr;</div><div class=\"fcnode fca\">Prefixes + -ide ending</div><div class=\"fcnode fcw\" style=\"margin-top:.35rem\">No mono- on first. Drop -o/-a before oxide.</div></div></div></div></div>";
  return "<p>Not found.</p>";
}
function rRef(a){
  a.innerHTML="<div class=\"ph\"><h1>Reference Sheet</h1></div><div class=\"tabrow\"><button class=\"tab active\" id=\"tab-pi\" onclick=\"swRef('pi')\">Polyatomic ions</button><button class=\"tab\" id=\"tab-rules\" onclick=\"swRef('rules')\">Naming rules</button><button class=\"tab\" id=\"tab-pref\" onclick=\"swRef('pref')\">Prefixes</button><button class=\"tab\" id=\"tab-ox\" onclick=\"swRef('ox')\">Oxidation states</button></div><div id=\"rC\"></div>";
  swRef("pi");
}
function swRef(t){
  var tabs=document.querySelectorAll(".tab");
  for(var i=0;i<tabs.length;i++) tabs[i].classList.remove("active");
  g("tab-"+t).classList.add("active");
  var c=g("rC");
  if(t==="pi"){
    var h="<div class=\"prgrid\">";
    for(var i=0;i<PI.length;i++) h+="<div class=\"prc\"><div class=\"prcn\">"+PI[i].n+"</div><div class=\"prcf\">"+PI[i].f+"<sup style=\"font-size:.6em\">"+PI[i].c+"</sup></div></div>";
    c.innerHTML=h+"</div>";
  } else if(t==="rules"){
    c.innerHTML="<div class=\"rcard\" style=\"border-left-color:var(--blue)\"><h3>Binary ionic</h3><p>1. Metal name unchanged.<br>2. Nonmetal with <strong>-ide</strong>.<br>3. Transition metals get Roman numeral.<br><strong>No prefixes.</strong></p></div>"
      +"<div class=\"rcard\" style=\"border-left-color:var(--gn)\"><h3>Binary covalent</h3><p>1. First nonmetal (skip mono- if only 1).<br>2. Second nonmetal with <strong>-ide</strong>.<br>3. Add prefixes to both.<br>4. Drop -o/-a before oxide: tetroxide not tetraoxide.</p></div>"
      +"<div class=\"rcard\" style=\"border-left-color:var(--am)\"><h3>Ionic + polyatomic</h3><p>1. Name cation.<br>2. Name polyatomic anion as memorized.<br>3. Parentheses when ion appears more than once.<br>4. Transition metals still need Roman numerals.</p></div>"
      +"<div class=\"rcard\" style=\"border-left-color:var(--bds)\"><h3>-ide vs -ate vs -ite</h3><p><strong>-ide</strong> = monatomic anion<br><strong>-ate</strong> = polyatomic, more oxygens<br><strong>-ite</strong> = polyatomic, fewer oxygens</p></div>"
      +"<div class=\"rcard\" style=\"border-left-color:var(--pu)\"><h3>Roman numeral calculation</h3><p>Total anion charge &divide; number of metal ions = metal charge.<br>Fe&#x2082;O&#x2083;: 3&times;2-=6-, &divide;2=3+ &rarr; iron(III)</p></div>"
      +"<div class=\"rcard\" style=\"border-left-color:var(--rd)\"><h3>No Roman numeral needed</h3><p>Ag always 1+ &nbsp;&bull;&nbsp; Zn always 2+ &nbsp;&bull;&nbsp; Cd always 2+</p></div>";
  } else if(t==="pref"){
    var ps=[["mono-","1"],["di-","2"],["tri-","3"],["tetra-","4"],["penta-","5"],["hexa-","6"],["hepta-","7"],["octa-","8"],["nona-","9"],["deca-","10"]];
    var h="<div class=\"pgrid\">";
    for(var i=0;i<ps.length;i++) h+="<div class=\"pitm\"><span class=\"pref-n\">"+ps[i][0]+"</span><span class=\"pref-d\">"+ps[i][1]+"</span></div>";
    c.innerHTML=h+"</div><div class=\"notice\">Never use mono- on first element. Drop -o/-a before oxide: monoxide, dioxide, trioxide, tetroxide, pentoxide, hexoxide, heptoxide, octoxide, nonoxide, decoxide.</div>";
  } else {
    c.innerHTML="<div class=\"rcard\" style=\"border-left-color:var(--blue)\"><h3>Main group</h3><p>Group 1: +1 &nbsp;&bull;&nbsp; Group 2: +2 &nbsp;&bull;&nbsp; Group 13: +3<br>Group 15: 3- &nbsp;&bull;&nbsp; Group 16: 2- &nbsp;&bull;&nbsp; Group 17: 1- &nbsp;&bull;&nbsp; Group 18: 0</p></div>"
      +"<div class=\"rcard\" style=\"border-left-color:var(--am)\"><h3>Transition metals</h3><p>Fe: 2+ or 3+ &nbsp;&bull;&nbsp; Cu: 1+ or 2+ &nbsp;&bull;&nbsp; Sn: 2+ or 4+ &nbsp;&bull;&nbsp; Pb: 2+ or 4+<br>Mn: 2+, 4+, 7+ &nbsp;&bull;&nbsp; Cr: 2+ or 3+ &nbsp;&bull;&nbsp; Co: 2+ or 3+<br>Ag: 1+ (no Roman numeral) &nbsp;&bull;&nbsp; Zn: 2+ (no Roman numeral)</p></div>"
      +"<div class=\"rcard\" style=\"border-left-color:var(--gn)\"><h3>Special</h3><p>H: +1 usually, 1- in hydrides &nbsp;&bull;&nbsp; O: 2- usually, 1- in peroxides &nbsp;&bull;&nbsp; F: always 1-</p></div>";
  }
}
